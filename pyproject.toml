[build-system]
requires = ["setuptools>=65", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "reportmachine-runner"
version = "0.1.0"
description = "OS-neutral Codex runner for ReportMachine article workflows."
requires-python = ">=3.10"
readme = "AGENTS.md"
authors = [{ name = "ReportMachine" }]
license = { text = "Apache-2.0" }
dependencies = ["jsonschema>=4.0", 'tomli>=2; python_version < "3.11"']

[project.optional-dependencies]
web = ["Flask>=3.1,<4", "waitress>=3,<4"]
publish = ["reportlab>=4.0"]
build = ["pyinstaller>=6.0", "Pillow>=10.1.0"]
dev = ["pyinstaller>=6.0", "Pillow>=10.1.0"]

[project.scripts]
reportmachine-runner = "reportmachine_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reportmachine_runner = ["web/templates/*.html", "web/static/*.js", "web/static/*.css"]
