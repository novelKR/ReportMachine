[profiles.default]
mode = "industry"
topic = "inputs/topic.md"
sources = "inputs/sources.csv"
schema = "schemas/article_result.schema.json"
web_search = "cached"
allow_shell_network = false
run_id_prefix = "default"

[profiles.default.source_ingest]
enabled = true
allowed_domains = []
max_download_bytes = 52428800
pdf_render_dpi = 144
max_pdf_pages = 40
max_image_inputs = 20

[profiles.default.summary]
enabled = false
image_generation_surface = "codex_internal_tool"
paper_size = "A4"
orientation = "portrait"
language = "ko"
style_name = "clean_editorial_korean_report"
style_prompt = """
한국어 산업 분석 리포트용 A4 세로 요약 이미지.
차분한 editorial report 스타일, 높은 가독성, 과장된 투자 홍보 느낌 금지.
"""
negative_prompt = """
투자 추천, 주가 전망, 과도한 3D 그래픽, 장식적 로고 콜라주, 읽기 어려운 작은 글씨 금지.
"""
max_visual_claims = 6
require_source_footer = true

[profiles.default.publish]
# Reader-friendly A4 PDF output. Deterministic local render; no Codex or API calls.
enabled = false
paper_size = "A4"
orientation = "portrait"
margin_mm = 20.0
body_font_size = 10.5
body_leading = 17.5
include_cover = true
include_toc = true
include_link_footnotes = true
max_image_height_ratio = 0.6
# Set font_regular when automatic Hangul font discovery fails on this machine.
# font_regular = "/usr/share/fonts/truetype/nanum/NanumGothic.ttf"
# font_bold is optional; without it the regular face is reused for bold slots.
# font_bold = "/usr/share/fonts/truetype/nanum/NanumGothicBold.ttf"

# Copy this file to reportmachine.local.toml for machine-specific artifact roots.
# External artifact roots are used only by the runner. They are not exposed to Codex prompts.
#
# [profiles.default.artifacts]
# external_root = "~/ReportMachineArtifacts"
# import_existing = true
# snapshot_interval_seconds = 60
# cleanup_cache_on_success = true
# preserve_cache_on_failure = true

[profiles.earnings]
mode = "earnings"
topic = "inputs/topic.md"
sources = "inputs/sources.csv"
schema = "schemas/article_result.schema.json"
web_search = "live"
allow_shell_network = false
run_id_prefix = "earnings"

[profiles.earnings.source_ingest]
enabled = true
allowed_domains = []
max_download_bytes = 52428800
pdf_render_dpi = 144
max_pdf_pages = 40
max_image_inputs = 20

[profiles.earnings.summary]
enabled = false
image_generation_surface = "codex_internal_tool"
paper_size = "A4"
orientation = "portrait"
language = "ko"
style_name = "clean_editorial_korean_report"
style_prompt = """
한국어 실적/IR 분석 리포트용 A4 세로 요약 이미지.
차분한 editorial report 스타일, 높은 가독성, 과장된 투자 홍보 느낌 금지.
"""
negative_prompt = """
투자 추천, 목표주가, 매수/매도 의견, 과도한 3D 그래픽, 읽기 어려운 작은 글씨 금지.
"""
max_visual_claims = 6
require_source_footer = true

[profiles.earnings.publish]
enabled = false
paper_size = "A4"
orientation = "portrait"
margin_mm = 20.0
body_font_size = 10.5
body_leading = 17.5
include_cover = true
include_toc = true
include_link_footnotes = true
max_image_height_ratio = 0.6
